name: API reference → GitHub Pages

# Publishes the versioned documentation site to GitHub Pages on every push to main: latest/ (main) plus one
# directory per vX.Y.Z tag (typedoc API reference + the guides under docs/), a version switcher on every page and
# versions.json. Site: https://<owner>.github.io/<repo>/.
# Pages must be enabled once (Settings → Pages → Source: GitHub Actions); GITHUB_TOKEN cannot create the site.
#
# Not triggered by tags: the github-pages environment only accepts deployments from main (a tag push was rejected
# for v0.4.0), and every main build already includes every tag (fetch-depth 0). A release shows up with the next
# main push — the release commit itself is one — or run this workflow by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every release tag is built into its own directory
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:site
      # coverage badge next to the site root: README embeds it through shields.io/endpoint
      - run: pnpm test:coverage
      - run: node scripts/coverage-summary.mjs coverage/coverage-summary.json --badge site/coverage.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
