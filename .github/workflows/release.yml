name: Release

# Tag `vX.Y.Z` (matching packages/columna/package.json) → full gates → GitHub Release with the packed tarball,
# the CHANGELOG section as notes and the SHA-256 of the tarball → npm publish with provenance (only when the
# NPM_TOKEN secret exists; the GitHub Release is created either way).
#
#   pnpm release:prepare 0.3.0    # bumps versions, moves [Unreleased] → [0.3.0], checks the section
#   git commit -am "Release 0.3.0" && git tag v0.3.0 && git push --follow-tags

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: tag must match packages/columna/package.json and have a CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/columna/package.json').version")
          test "$VERSION" = "$PKG" || { echo "tag v$VERSION but package.json says $PKG"; exit 1; }
          node scripts/changelog-section.mjs "$VERSION" --check
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/consumer-test.mjs

      - name: pack
        run: |
          mkdir -p release
          # `pnpm --filter … pack` can inherit a recursive flag from the workspace CLI and fail.
          pnpm --dir packages/columna pack --pack-destination "$PWD/release"
          (cd release && sha256sum columna-*.tgz > SHA256SUMS)
          cat release/SHA256SUMS
          node scripts/changelog-section.mjs "$VERSION" > release/notes.md
          printf '\n---\n`npm install columna@%s`\n\nTarball SHA-256:\n```\n' "$VERSION" >> release/notes.md
          cat release/SHA256SUMS >> release/notes.md
          printf '```\n' >> release/notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/columna-*.tgz release/SHA256SUMS --title "columna $VERSION" --notes-file release/notes.md

      - name: npm publish (provenance)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter columna publish --provenance --access public --no-git-checks
