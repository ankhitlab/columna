name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# pnpm's version comes from package.json "packageManager" only — a second declaration here made
# pnpm/action-setup fail before any test ran (run 35142143370).

jobs:
  check:
    name: lint · test · build · typecheck (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # includes the type-level schema tests (tsc over tests/schema-types.test.ts)
      - run: pnpm typecheck
      - if: matrix.node-version != 22
        run: pnpm test
      # Arrow IPC interop against apache-arrow (its own package + config; the core suite has no Arrow dependency)
      - run: pnpm test:interop
      # Node 22 also measures coverage: summary into the job page, full HTML report as an artifact.
      - if: matrix.node-version == 22
        run: pnpm test:coverage
      - if: matrix.node-version == 22
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 30

  consumer:
    name: packed tarballs in a clean npm project (ESM · CJS · subpaths · types)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/consumer-test.mjs

  docs:
    name: API reference (typedoc)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:api
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api
          retention-days: 30

  browser:
    name: built bundle in headless Chromium (CPU path · DuckDB-Wasm Arrow IPC exchange · WebGPU when an adapter exists)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @columna/browser-smoke exec playwright install --with-deps chromium
      - run: pnpm --filter @columna/browser-smoke run test:ci

  windows:
    name: test on windows (node 22)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
