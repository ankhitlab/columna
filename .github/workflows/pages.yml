name: API reference → GitHub Pages

# Publishes docs/api (typedoc over the columna umbrella entry points) to GitHub Pages on every push to main.
# First run enables Pages for the repository (configure-pages `enablement: true`); afterwards the site lives at
# https://<owner>.github.io/<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:api
      # coverage badge next to the API reference: README embeds it through shields.io/endpoint
      - run: pnpm test:coverage
      - run: node scripts/coverage-summary.mjs coverage/coverage-summary.json --badge docs/api/coverage.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
